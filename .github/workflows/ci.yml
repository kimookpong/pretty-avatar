name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:skill
      - run: npm test
      - run: npm run build
      - run: npx vite build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy
      - run: python3 skills/pretty-avatar/scripts/render_prompts.py --check
      - run: python3 -m unittest discover -s tests -v
